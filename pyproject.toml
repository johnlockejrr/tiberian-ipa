[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiberian-ipa"
version = "0.1.0"
description = "Tiberian Hebrew IPA transcription (havarot + hebtrans + Tiberian schema)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Khan Tiberian Project" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tiberian = "tiberian_ipa.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/havarot",
  "src/hebtrans",
  "src/tiberian_ipa",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
